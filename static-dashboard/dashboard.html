<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReconX (Static) - Dashboard</title>

    <link rel="stylesheet" href="css/style.css" />
</head>
<body class="app-shell">
    <!-- Header -->
    <header class="app-header" role="banner">
        <h1>ReconX</h1>

        <nav aria-label="Main Navigation">
            <a href="dashboard.html" aria-current="page">Dashboard</a>
            <a href="trades.html">Trades</a>
            <a href="recon.html">Reconciliation</a>
        </nav>

        <button id="theme-toggle" aria-label="Toggle light/dark theme">
            🌗
        </button>
    </header>

    <!-- Middle Section -->
    <div class="app-body">

        <!-- Sidebar -->
        <aside class="app-sidebar" role="complementary">
            <h2>Quick Filters</h2>

            <ul>
                <li><a href="#">All Trades</a></li>
                <li><a href="#">Open Breaks</a></li>
                <li><a href="#">Today's Trades</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="app-main" role="main">

            <!-- KPI Cards -->
            <section aria-labelledby="kpi-heading">

                <h2 id="kpi-heading">Today's Summary</h2>

                <div class="dashboard-grid">

                    <article class="stat-card">
                        <h3>Total Trades</h3>
                        <p>120</p>
                    </article>

                    <article class="stat-card">
                        <h3>Matched</h3>
                        <p>105</p>
                    </article>

                    <article class="stat-card">
                        <h3>Open Breaks</h3>
                        <p>15</p>
                    </article>

                </div>

            </section>

            <!-- Live Trade Feed -->
            <section aria-labelledby="feed-heading">

                <h2 id="feed-heading">Live Trade Feed</h2>

                <div
                    id="trade-feed"
                    role="status"
                    aria-live="polite"
                    aria-atomic="false">
                </div>

            </section>

        </main>

    </div>

    <!-- Footer -->
    <footer class="app-footer" role="contentinfo">
        <small>ReconX TDI 2026 · Static Dashboard (Day 7)</small>
    </footer>

    <script src="js/theme.js"></script>
    <script src="js/sse.js"></script>

</body>
</html>
